<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#070A10" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA">
        <animate attributeName="stop-color" values="#60A5FA;#A78BFA;#38BDF8;#60A5FA" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#F472B6;#818CF8;#A78BFA" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#60A5FA;#C084FC;#38BDF8" dur="6s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 38px; fill: url(#text-grad); letter-spacing: -0.5px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 14.5px; fill: #94A3B8; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; fill: #E2E8F0; }
  </style>

  <!-- Background -->
  <rect width="960" height="280" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Animated Grid -->
  <g opacity="0.3">
    <line x1="60" y1="0" x2="60" y2="280" stroke="#334155" stroke-dasharray="4,4" />
    <line x1="200" y1="0" x2="200" y2="280" stroke="#334155" stroke-dasharray="4,4" />
    <line x1="340" y1="0" x2="340" y2="280" stroke="#334155" stroke-dasharray="4,4" />
    <line x1="480" y1="0" x2="480" y2="280" stroke="#334155" stroke-dasharray="4,4" />
    <line x1="620" y1="0" x2="620" y2="280" stroke="#334155" stroke-dasharray="4,4" />
    <line x1="760" y1="0" x2="760" y2="280" stroke="#334155" stroke-dasharray="4,4" />
    <line x1="900" y1="0" x2="900" y2="280" stroke="#334155" stroke-dasharray="4,4" />
    <line x1="0" y1="70" x2="960" y2="70" stroke="#334155" stroke-dasharray="4,4" />
    <line x1="0" y1="140" x2="960" y2="140" stroke="#334155" stroke-dasharray="4,4" />
    <line x1="0" y1="210" x2="960" y2="210" stroke="#334155" stroke-dasharray="4,4" />
  </g>

  <!-- Prospecting Radar Visual (Right Side) -->
  <g transform="translate(800, 140)">
    <circle r="95" fill="none" stroke="#1E293B" stroke-width="1.5" />
    <circle r="70" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <circle r="45" fill="none" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
    <circle r="20" fill="none" stroke="#818CF8" stroke-opacity="0.4" stroke-width="1" />
    
    <!-- Radar Sweep Animation -->
    <path d="M 0 0 L 85 -40 A 95 95 0 0 0 0 -95 Z" fill="url(#glow-grad)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="4s" repeatCount="indefinite" />
    </path>

    <!-- Radar center ping -->
    <circle r="4" fill="#38BDF8" filter="url(#glow)">
      <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite" />
    </circle>

    <!-- Prospect Targets Pinging -->
    <circle cx="35" cy="-28" r="3.5" fill="#10B981" filter="url(#glow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="r" values="2.5;4.5;2.5" dur="2.4s" repeatCount="indefinite" />
    </circle>
    <circle cx="-45" cy="30" r="3" fill="#F59E0B" filter="url(#glow)">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.1s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="40" r="3.5" fill="#6366F1" filter="url(#glow)">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <circle cx="-25" cy="-55" r="3" fill="#EC4899" filter="url(#glow)">
      <animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(60, 48)">
    <!-- Category Pill -->
    <rect width="186" height="26" rx="13" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#10B981">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17.5" class="badge-text" fill="#38BDF8">B2B SALES INTELLIGENCE</text>

    <!-- Main Title -->
    <text x="0" y="68" class="title" filter="url(#glow-subtle)">Awesome Sales Prospecting</text>

    <!-- Subtitle -->
    <text x="0" y="98" class="subtitle">Curated B2B Contact Data, Lead Intelligence, Enrichment &amp; Outreach</text>

    <!-- Capability Tags / Badges -->
    <g transform="translate(0, 122)">
      <rect x="0" y="0" width="138" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="12" y="20.5" class="badge-text">🎯 Verified B2B Data</text>

      <rect x="148" y="0" width="130" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="160" y="20.5" class="badge-text">⚡ Lead Enrichment</text>

      <rect x="288" y="0" width="134" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="300" y="20.5" class="badge-text">🤖 AI Outbound Bots</text>

      <rect x="432" y="0" width="144" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="444" y="20.5" class="badge-text">🌐 Open Source OSINT</text>
    </g>

    <!-- Status Metrics -->
    <g transform="translate(0, 174)">
      <text x="0" y="14" class="subtitle" font-size="13px" fill="#64748B">
        📊 <tspan fill="#CBD5E1" font-weight="600">SaaS Giants &amp; Open-Source Tools</tspan> • 🔄 <tspan fill="#38BDF8">Updated Live for 2026</tspan>
      </text>
    </g>
  </g>
</svg>